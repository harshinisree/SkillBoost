name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only used to publish the coverage badge after a merge to main

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skillboost_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/skillboost_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy app

      - name: Run tests with coverage (fails below 80%)
        run: pytest --cov=app --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80

      - name: Publish the coverage badge
        # Only after a merge to main; pull requests never write to the repository.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir badge
          python .github/scripts/coverage_badge.py coverage.json badge/coverage.json
          cd badge
          git init --quiet --initial-branch=badges
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Update coverage badge"
          git push --force --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  compose:
    # Proves the README promise: one command starts the app and MySQL.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build and start the app and MySQL
        run: docker compose up --build --detach --wait

      - name: Health check
        run: curl --fail --silent --show-error http://localhost:8000/health

      - name: Seed demo data and log in
        run: |
          docker compose exec -T app flask --app app seed
          curl --fail --silent --show-error -X POST http://localhost:8000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "admin@skillboost-demo.com", "password": "DemoPass123!"}'

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Stop and remove everything
        if: always()
        run: docker compose down --volumes
