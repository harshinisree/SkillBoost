name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: skillboost_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      TEST_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/skillboost_test

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

  compose:
    # Proves the README promise: one command starts the app and MySQL.
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Build and start the app and MySQL
        run: docker compose up --build --detach --wait

      - name: Health check
        run: curl --fail --silent --show-error http://localhost:8000/health

      - name: Seed demo data and log in
        run: |
          docker compose exec -T app flask --app app seed
          curl --fail --silent --show-error -X POST http://localhost:8000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email": "admin@skillboost-demo.com", "password": "DemoPass123!"}'

      - name: Show container logs if anything failed
        if: failure()
        run: docker compose logs

      - name: Stop and remove everything
        if: always()
        run: docker compose down --volumes
